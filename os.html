<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS - CNT Assistência</title>
  <link rel="preload" as="image" href="img/logo.png">
  <style>
    /* ===== VARIÁVEIS ===== */
    :root {
      --bg-dark: #1D1D1D;
      --bg-secondary: #2A2A2A;
      --border-color: #444;
      --text-light: #fff;
      --accent-color: #2A2A2A;
      --error-color: #ff4444;
      --progress-color: #ffffff;
      --input-bg: var(--bg-secondary);
      --input-border: var(--border-color);
      --input-focus-border: #007bff;
      --accent-hover: #3A3A3A;
      --orange-progress: var(--progress-color);
      --separator-color: #444444;
      --readonly-text: #aaaaaa;
    }

    /* ===== ESTILOS GERAIS ===== */
    body {
      margin: 0;
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 16px;
      line-height: 1.6;
    }

    /* ===== BARRA DE PROGRESSO ===== */
    .barra-progresso {
      width: 15px;
      background-color: var(--bg-secondary);
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      border-right: 1px solid var(--separator-color);
      z-index: 1001;
      display: flex;
      flex-direction: column-reverse;
      justify-content: flex-start;
    }

    .progresso {
      width: 100%;
      background-color: var(--progress-color);
      transition: height 0.5s ease;
      height: 0%;
      position: absolute;
      bottom: 0;
    }

    /* ===== CONTEÚDO PRINCIPAL ===== */
    .conteudo {
      margin-left: 35px;
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
      padding-bottom: 120px;
      box-sizing: border-box;
    }

    /* ===== FORM STEPS ===== */
    .form-step {
      display: none;
      margin-bottom: 20px;
      padding: 15px;
      background-color: rgba(42, 42, 42, 0.3);
      border-radius: 8px;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.5s ease-in-out, max-height 0.5s ease-in-out, margin-bottom 0.5s ease-in-out;
    }

    .form-step.visible-step {
      display: block;
      animation: fadeIn 0.3s ease;
      opacity: 1;
      max-height: 1000px;
      margin-bottom: 25px;
    }

    .form-step.completed {
      opacity: 0.8;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== ESTRUTURA DO FORMULÁRIO ===== */
    .input-area {
      max-width: 800px;
      margin: 0 auto;
    }

    .linha {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 15px;
      align-items: center;
      padding: 0;
    }

    .col {
      flex: 1;
      min-width: 200px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 14px;
      color: var(--text-light);
    }

    input, select, textarea, input[type="number"] {
      width: 100%;
      padding: 10px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-light);
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .invalid, .invalid-field {
      border-color: var(--error-color) !important;
      box-shadow: 0 0 0 2px rgba(255, 68, 68, 0.2) !important;
    }

    input:focus, select:focus, textarea:focus, input[type="number"]:focus {
        border-color: var(--input-focus-border);
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.3);
        outline: none;
    }

    select {
        background-image: url('data:image/svg+xml;utf8,<svg fill="%23f0f0f0" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 20px;
        padding-right: 40px;
    }

    .readonly-field {
        color: var(--readonly-text);
        font-size: 14px;
        padding: 8px 0;
        display: block;
        margin-bottom: 0px;
        border-bottom: 1px dashed var(--separator-color);
        padding-bottom: 5px;
    }

    /* ===== GRUPOS DE RÁDIO ===== */
    .radio-container {
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 12px;
      background-color: var(--bg-secondary);
      flex: 1;
      min-width: 0;
    }

    .radio-group, .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .radio-group span, .checkbox-group span {
      font-weight: 500;
      white-space: nowrap;
      font-size: 14px;
    }

    .radio-group label, .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 0;
      cursor: pointer;
      font-size: 14px;
      font-weight: normal;
    }

    .radio-group input[type="radio"], .checkbox-group input[type="radio"] {
        width: auto;
        margin: 0;
        padding: 0;
        transform: scale(1.2);
        accent-color: var(--progress-color);
    }

    /* ===== BOTÕES DE AÇÃO ===== */
    .fixed-action-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 25px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1em;
      z-index: 1000;
      transition: background-color 0.3s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .fixed-action-button:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    }

    .fixed-action-button:disabled {
      background-color: var(--input-border);
      color: var(--readonly-text);
      cursor: not-allowed;
      opacity: 0.7;
      transform: none;
      box-shadow: none;
    }

    .inicio-action-button, .historico-button {
      position: fixed;
      background-color: var(--accent-color);
      color: var(--text-light);
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1em;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
      z-index: 1000;
      font-weight: bold;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .inicio-action-button {
        top: 20px;
        left: 20px;
    }

    .historico-button {
        top: 20px;
        right: 20px;
    }

    .inicio-action-button:hover, .historico-button:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    }

    .inicio-action-button:disabled, .historico-button:disabled {
      background-color: var(--input-border);
      color: var(--readonly-text);
      cursor: not-allowed;
      opacity: 0.7;
      transform: none;
      box-shadow: none;
    }

    /* ===== TÍTULO E CONTATO ===== */
    .titulo {
      text-align: center;
      margin-bottom: 15px;
      margin-top: 5px;
    }

    .titulo img {
        max-height:60px;
        height:auto;
        margin-bottom: 5px;
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
    }

    .contato {
      text-align: center;
      font-size: 14px;
      margin-top: 5px;
      color: var(--readonly-text);
    }

    .conteudo h2 {
        text-align: center;
        margin:10px 0;
        font-size:18px;
        color: var(--text-light);
        border-bottom: 1px dashed var(--separator-color);
        padding-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }

    /* TERMOS E CONDIÇÕES */
    .termos-condicoes {
      margin-top: 10px;
      padding: 10px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .termos-condicoes h3 {
      text-align:center;
      margin:10px 0;
      font-size:14px;
      color: var(--text-light);
      border-bottom: 1px dashed var(--separator-color);
      padding-bottom: 10px;
    }

    .termos-condicoes ol {
      list-style-type: decimal;
      padding-left:20px;
      margin:8px 0;
      font-size:12px;
    }

    .termos-condicoes li {
        margin-bottom: 10px;
    }
    .termos-condicoes p {
        margin: 5px 0;
        color: var(--text-light);
        font-size: 0.95em;
    }
    .termos-condicoes strong {
        color: var(--progress-color);
    }

    /* Assinaturas */
    .assinatura-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        margin-top: 15px;
    }
    .linha-assinatura {
        border-top: 1px solid #000;
        padding-top: 25px;
        margin-top: 30px;
        display: block;
        width: 100%;
        min-height: 1em;
        box-sizing: border-box;
    }
    .linha-assinatura-label {
        text-align: center;
        font-weight: normal;
        font-size: 0.9em;
        margin-top: 5px;
        padding-bottom: 5px;
    }
    .assinaturas-row {
        display: flex !important;
        gap: 20px !important;
        margin-top: 15px !important;
        flex-wrap: wrap !important;
    }
    .assinaturas-row .col {
        flex: 1;
        min-width: 200px;
    }


    /* Estilos específicos para impressão */
    .print-only-field {
          display: block !important;
          color: #000 !important;
          font-size: 1em !important;
          border: 1px solid #000 !important;
          padding: 2px 4px !important;
          border-radius: 2px !important;
          box-sizing: border-box !important;
          min-height: 1.2em !important;
          white-space: pre-wrap !important;
    }
    .col .print-only-field {
          width: 100% !important;
    }



    /* ===== BOTÕES DO MODELO DA OS ===== */
    .modelo-os-inline {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      flex-wrap: nowrap;
    }

    .modelo-os-label {
      margin: 0;
      min-width: 115px;
      white-space: nowrap;
      font-weight: 700;
    }

    .modelo-os-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      flex-wrap: nowrap;
    }

    .modelo-os-btn {
      background: var(--bg-secondary);
      color: var(--text-light);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .modelo-os-btn:hover, .modelo-os-btn.selecionado {
      border-color: var(--text-light);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.12);
      transform: translateY(-1px);
    }

    .modelo-os-btn.invalid-field {
      border-color: var(--error-color) !important;
      box-shadow: 0 0 0 2px rgba(255,68,68,0.25) !important;
    }


    @media (max-width: 620px) {
      .modelo-os-inline {
        flex-wrap: wrap;
      }
      .modelo-os-buttons {
        flex-wrap: wrap;
      }
    }

    /* ===== RESPONSIVIDADE ===== */
    @media (max-width: 768px) {
      .radio-container {
        min-width: 100%;
      }

      .linha {
        flex-direction: column;
        gap: 10px;
      }

      .col {
        width: 100%;
      }
    }

    @media (max-width: 600px) {
        .conteudo {
            margin-left: 0;
            padding-left: 20px;
            padding-right: 20px;
        }
        .barra-progresso {
            display: none;
        }
    }

    @media (max-width: 480px) {
        .col {
            min-width: 100%;
        }
        .linha {
            flex-direction: column;
            gap: 15px;
        }
    }

              page-break-after:always !important;

              page-break-after: auto !important;
              break-after: auto !important;
            }
          }

        </style>
</head>
<body>
  <div class="barra-progresso">
    <div id="barra" class="progresso"></div>
  </div>

  <button id="homeButton" class="inicio-action-button" onclick="goHome()">INICIO</button>
  <button id="historicoButton" class="historico-button" onclick="goHistorico()">HISTÓRICO</button>

  <div class="conteudo">
    <div class="titulo">
      <img src="img/logo.png" alt="Logo" onerror="this.style.display='none'">
      <div class="contato">Contato: 84 99809-6865</div>
    </div>

    <h2 style="text-align:center;">ORDEM DE SERVIÇO</h2>

    <div class="linha initial-active" style="margin-bottom:15px;">
      <div class="col">
        <label>OS Nº</label>
        <span id="osNumber" class="readonly-field"></span>
      </div>
      <div class="col">
        <label>DATA DE ENTRADA</label>
        <span id="dataEntrada" class="readonly-field"></span>
      </div>
      <div class="col">
        <label>DATA DE SAÍDA</label>
        <span id="dataSaida" class="readonly-field"></span>
      </div>
    </div>

    <div class="form-step" data-step="1">
      <div class="input-area">
        <div class="linha">
          <div class="col modelo-os-inline">
            <label class="modelo-os-label">MODELO DA OS</label>
            <input type="hidden" id="modeloOS" value="">
            <div class="modelo-os-buttons" id="modeloOSButtons">
              <button type="button" class="modelo-os-btn" data-modelo="celular">Celular</button>
              <button type="button" class="modelo-os-btn" data-modelo="computador">PC / NOTE</button>
              <button type="button" class="modelo-os-btn" data-modelo="caixa_som">Caixa de Som</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="form-step" data-step="2">
      <div class="input-area">
        <div class="linha">
          <div class="col">
            <label for="nomeCliente">NOME DO CLIENTE</label>
            <input type="text" id="nomeCliente" required minlength="3" data-form-field="true">
          </div>
        </div>
      </div>
    </div>

    <div class="form-step" data-step="3">
      <div class="input-area">
        <div class="linha">
          <div class="col">
            <label for="telefone">TELEFONE</label>
            <input type="tel" id="telefone" placeholder="(00) 0 0000-0000" maxlength="15" required data-form-field="true">
          </div>
          <div class="col">
            <label for="tecnico">TÉCNICO</label>
            <select id="tecnico" required data-form-field="true">
              <option value="">Selecione</option>
              <option>Bruno Santos</option>
              <option>João Paulo</option>
              <option>Joaquim Sobral</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="form-step" data-step="4">
      <div class="input-area">
        <div id="marcaModeloArea">
          <div class="linha">
            <div class="col">
              <label for="marcaEquipamento">MARCA <span style="font-weight:normal; color:var(--readonly-text);">(opcional)</span></label>
              <input type="text" id="marcaEquipamento" placeholder="Ex.: Samsung, Motorola, Dell, Lenovo" data-form-field="true">
            </div>
            <div class="col">
              <label for="modeloEquipamento">MODELO / IDENTIFICAÇÃO DO EQUIPAMENTO</label>
              <input type="text" id="modeloEquipamento" placeholder="Ex.: A15, Inspiron, PC Gamer preto, caixa JBL" required data-form-field="true">
            </div>
          </div>
        </div>
        <div id="senhaCelularArea" class="hidden">
          <div class="linha">
            <div class="col">
              <label for="senhaEscrita">SENHA ESCRITA</label>
              <input type="text" id="senhaEscrita" placeholder="Ex.: 1234, 0000 ou nenhuma" data-form-field="true">
            </div>
            <div class="col" id="senhaPadraoArea">
              <label>SENHA PADRÃO</label>
              <div id="padraoGrid" style="border:1px solid var(--border-color); border-radius:4px; background-color:var(--bg-secondary); padding:14px; display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; max-width:230px; margin:0 auto; box-sizing:border-box;">
                <button type="button" data-dot="1" aria-label="Ponto 1" style="height:28px; border:none; background:transparent; color:var(--text-light); font-size:26px; line-height:1; cursor:pointer;">•</button>
                <button type="button" data-dot="2" aria-label="Ponto 2" style="height:28px; border:none; background:transparent; color:var(--text-light); font-size:26px; line-height:1; cursor:pointer;">•</button>
                <button type="button" data-dot="3" aria-label="Ponto 3" style="height:28px; border:none; background:transparent; color:var(--text-light); font-size:26px; line-height:1; cursor:pointer;">•</button>
                <button type="button" data-dot="4" aria-label="Ponto 4" style="height:28px; border:none; background:transparent; color:var(--text-light); font-size:26px; line-height:1; cursor:pointer;">•</button>
                <button type="button" data-dot="5" aria-label="Ponto 5" style="height:28px; border:none; background:transparent; color:var(--text-light); font-size:26px; line-height:1; cursor:pointer;">•</button>
                <button type="button" data-dot="6" aria-label="Ponto 6" style="height:28px; border:none; background:transparent; color:var(--text-light); font-size:26px; line-height:1; cursor:pointer;">•</button>
                <button type="button" data-dot="7" aria-label="Ponto 7" style="height:28px; border:none; background:transparent; color:var(--text-light); font-size:26px; line-height:1; cursor:pointer;">•</button>
                <button type="button" data-dot="8" aria-label="Ponto 8" style="height:28px; border:none; background:transparent; color:var(--text-light); font-size:26px; line-height:1; cursor:pointer;">•</button>
                <button type="button" data-dot="9" aria-label="Ponto 9" style="height:28px; border:none; background:transparent; color:var(--text-light); font-size:26px; line-height:1; cursor:pointer;">•</button>
              </div>
              <div style="text-align:center; margin-top:6px; font-size:13px; color:var(--readonly-text);">
                Padrão: <span id="senhaPadraoTexto">______</span>
                <button type="button" id="limparPadrao" style="margin-left:8px; background:var(--accent-color); color:var(--text-light); border:1px solid var(--border-color); border-radius:4px; padding:3px 8px; cursor:pointer;">Limpar</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="form-step" data-step="5">
      <div class="input-area">
        <div class="linha">
          <div class="radio-container" id="ligaGroup"><div class="radio-group">
              <span>LIGA:</span>
              <label><input type="radio" name="liga" value="sim" required data-form-field="true"> Sim</label>
              <label><input type="radio" name="liga" value="nao" required data-form-field="true"> Não</label>
            </div>
          </div>
          <div class="radio-container" id="acessorioGroup"><div class="radio-group">
              <span>ACESSÓRIO:</span>
              <label><input type="radio" name="acessorio" value="nao" checked data-form-field="true"> Não</label>
              <label><input type="radio" name="acessorio" value="sim" data-form-field="true"> Sim</label>
            </div>
          </div>
          <div class="radio-container" id="defeitoGroup"><div class="radio-group">
              <span>DEFEITO FÍSICO:</span>
              <label><input type="radio" name="defeito" value="nao" checked data-form-field="true"> Não</label>
              <label><input type="radio" name="defeito" value="sim" data-form-field="true"> Sim</label>
            </div>
          </div>
        </div>
        <div class="linha hidden" id="campoAcessorio"><div class="col">
            <label for="qualAcessorio">QUAL ACESSÓRIO</label>
            <input type="text" id="qualAcessorio" data-form-field="true">
          </div>
        </div>
        <div class="linha hidden" id="campoDefeito"><div class="col">
            <label for="qualDefeito">QUAL DEFEITO</label>
            <input type="text" id="qualDefeito" data-form-field="true">
          </div>
        </div>
      </div>
    </div>

    <div class="form-step" data-step="6">
      <div class="input-area">
        <div class="linha">
          <div class="col">
            <label for="descricaoDefeito">DESCRIÇÃO DO DEFEITO</label>
            <textarea id="descricaoDefeito" rows="3" required placeholder="Relate aqui o defeito informado pelo cliente" data-form-field="true"></textarea>
          </div>
        </div>
        <div class="linha">
          <div class="col">
            <label for="observacoes">OBSERVAÇÕES</label>
            <textarea id="observacoes" rows="3" placeholder="Informações adicionais, estado do aparelho, urgência, detalhes combinados etc." data-form-field="true"></textarea>
          </div>
        </div>
      </div>
    </div>

    <div id="printContainer" style="display: none;"></div>
    <button id="mainActionButton" class="fixed-action-button" onclick="handleActionButtonClick()">Próximo →</button>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 6;
    let senhaPadrao = [];

    const MODELOS_OS = {
      celular: {
        texto: 'OS para Celular',
        tecnicoPadrao: 'Bruno Santos',
        mostrarSenha: true,
        mostrarPadrao: true,
        mostrarMarcaModelo: true,
        mostrarLiga: true,
        mostrarAcessorio: true,
        mostrarDefeitoFisico: true
      },
      computador: {
        texto: 'OS para Computadores e Notebooks',
        tecnicoPadrao: '',
        mostrarSenha: true,
        mostrarPadrao: false,
        mostrarMarcaModelo: true,
        mostrarLiga: true,
        mostrarAcessorio: true,
        mostrarDefeitoFisico: true
      },
      caixa_som: {
        texto: 'OS para Caixas de Som',
        tecnicoPadrao: 'Bruno Santos',
        mostrarSenha: false,
        mostrarPadrao: false,
        mostrarMarcaModelo: true,
        mostrarLiga: false,
        mostrarAcessorio: false,
        mostrarDefeitoFisico: false
      }
    };

    document.addEventListener('DOMContentLoaded', inicializarOS);

    function inicializarOS() {
      currentStep = 1;
      document.getElementById('osNumber').textContent = generateOSNumber();
      document.getElementById('dataEntrada').textContent = new Date().toLocaleDateString('pt-BR');
      document.getElementById('dataSaida').textContent = '';

      configurarRadios('acessorio', 'campoAcessorio', 'qualAcessorio');
      configurarRadios('defeito', 'campoDefeito', 'qualDefeito');
      configurarSenhaPadrao();
      configurarModeloOSButtons();

      document.querySelectorAll('[data-form-field="true"]').forEach(campo => {
        campo.addEventListener('keydown', handleEnterKey);
        campo.addEventListener('input', () => {
          campo.classList.remove('invalid-field');
          if (campo.id === 'telefone') formatarTelefone({ target: campo });
          if (campo.id === 'modeloOS') {
            alternarModeloOS();
            iniciarOSAoSelecionarModelo();
          }
          validarPassoAtual(false);
        });
        campo.addEventListener('change', () => {
          campo.classList.remove('invalid-field');
          if (campo.id === 'modeloOS') {
            alternarModeloOS();
            iniciarOSAoSelecionarModelo();
          }
          validarPassoAtual(false);
        });
      });

      document.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', () => validarPassoAtual(false));
      });

      showStep(currentStep);
    }

    function generateOSNumber() {
      const today = new Date();
      const datePart = `${today.getFullYear()}${(today.getMonth() + 1).toString().padStart(2, '0')}${today.getDate().toString().padStart(2, '0')}`;
      let counter = parseInt(localStorage.getItem(`osCount_${datePart}`) || '0', 10);
      if (counter >= 99) counter = 0;
      counter++;
      localStorage.setItem(`osCount_${datePart}`, counter.toString());
      return `${today.getFullYear()} ${datePart.slice(4, 6)}${datePart.slice(6, 8)} ${counter.toString().padStart(2, '0')}`;
    }

    function atualizarProgresso() {
      const barra = document.getElementById('barra');
      if (barra) barra.style.height = `${(currentStep / totalSteps) * 100}%`;
    }

    function configurarRadios(nomeGrupo, idCampoContainer, idInputAssociado) {
      document.querySelectorAll(`input[name="${nomeGrupo}"]`).forEach(radio => {
        radio.addEventListener('change', () => {
          const campoContainer = document.getElementById(idCampoContainer);
          const inputAssociado = document.getElementById(idInputAssociado);
          if (campoContainer && inputAssociado) {
            if (radio.value === 'sim' && radio.checked) {
              campoContainer.classList.remove('hidden');
            } else if (radio.value === 'nao' && radio.checked) {
              campoContainer.classList.add('hidden');
              inputAssociado.value = '';
            }
          }
          validarPassoAtual(false);
        });
      });
    }

    function configurarModeloOSButtons() {
      document.querySelectorAll('.modelo-os-btn').forEach(botao => {
        botao.addEventListener('click', () => {
          const modelo = botao.dataset.modelo;
          document.getElementById('modeloOS').value = modelo;
          document.querySelectorAll('.modelo-os-btn').forEach(btn => {
            btn.classList.toggle('selecionado', btn === botao);
            btn.classList.remove('invalid-field');
          });
          alternarModeloOS();
          iniciarOSAoSelecionarModelo();
          validarPassoAtual(false);
        });
      });
    }

    function configurarSenhaPadrao() {
      document.querySelectorAll('#padraoGrid button[data-dot]').forEach(botao => {
        botao.dataset.originalText = botao.textContent;
        botao.addEventListener('click', () => {
          const dot = botao.dataset.dot;
          if (!senhaPadrao.includes(dot)) {
            senhaPadrao.push(dot);
          } else {
            senhaPadrao = senhaPadrao.filter(item => item !== dot);
          }
          atualizarSenhaPadraoTexto();
          atualizarGradeSenhaPadrao();
        });
      });
      document.getElementById('limparPadrao').addEventListener('click', limparSenhaPadrao);
    }

    function atualizarGradeSenhaPadrao() {
      document.querySelectorAll('#padraoGrid button[data-dot]').forEach(botao => {
        const ordem = senhaPadrao.indexOf(botao.dataset.dot) + 1;
        if (ordem > 0) {
          botao.textContent = ordem;
          botao.style.opacity = '1';
          botao.style.fontSize = '18px';
          botao.style.fontWeight = 'bold';
          botao.style.border = '1px solid var(--text-light)';
          botao.style.borderRadius = '50%';
          botao.style.background = 'rgba(255,255,255,0.15)';
        } else {
          botao.textContent = botao.dataset.originalText || '•';
          botao.style.opacity = '1';
          botao.style.fontSize = '26px';
          botao.style.fontWeight = 'normal';
          botao.style.border = 'none';
          botao.style.borderRadius = '0';
          botao.style.background = 'transparent';
        }
      });
    }

    function atualizarSenhaPadraoTexto() {
      document.getElementById('senhaPadraoTexto').textContent = senhaPadrao.length ? senhaPadrao.join(' - ') : '______';
    }

    function limparSenhaPadrao() {
      senhaPadrao = [];
      atualizarSenhaPadraoTexto();
      atualizarGradeSenhaPadrao();
    }

    function alternarModeloOS() {
      const modelo = document.getElementById('modeloOS').value;
      const config = MODELOS_OS[modelo] || {};
      const tecnico = document.getElementById('tecnico');
      const areaSenha = document.getElementById('senhaCelularArea');
      const areaPadrao = document.getElementById('senhaPadraoArea');
      const marcaModeloArea = document.getElementById('marcaModeloArea');
      const ligaGroup = document.getElementById('ligaGroup');
      const acessorioGroup = document.getElementById('acessorioGroup');
      const defeitoGroup = document.getElementById('defeitoGroup');
      const campoAcessorio = document.getElementById('campoAcessorio');
      const campoDefeito = document.getElementById('campoDefeito');

      if (config.tecnicoPadrao) tecnico.value = config.tecnicoPadrao;

      areaSenha.classList.toggle('hidden', !config.mostrarSenha);
      areaPadrao.classList.toggle('hidden', !config.mostrarPadrao);
      marcaModeloArea.classList.toggle('hidden', !config.mostrarMarcaModelo);
      ligaGroup.classList.toggle('hidden', !config.mostrarLiga);
      acessorioGroup.classList.toggle('hidden', !config.mostrarAcessorio);
      defeitoGroup.classList.toggle('hidden', !config.mostrarDefeitoFisico);

      if (!config.mostrarSenha) document.getElementById('senhaEscrita').value = '';
      if (!config.mostrarPadrao) limparSenhaPadrao();
      if (!config.mostrarMarcaModelo) {
        document.getElementById('marcaEquipamento').value = '';
        document.getElementById('modeloEquipamento').value = '';
      }

      if (!config.mostrarLiga) {
        document.querySelectorAll('input[name="liga"]').forEach(r => r.checked = false);
      }
      if (!config.mostrarAcessorio) {
        document.querySelector('input[name="acessorio"][value="nao"]').checked = true;
        campoAcessorio.classList.add('hidden');
        document.getElementById('qualAcessorio').value = '';
      }
      if (!config.mostrarDefeitoFisico) {
        document.querySelector('input[name="defeito"][value="nao"]').checked = true;
        campoDefeito.classList.add('hidden');
        document.getElementById('qualDefeito').value = '';
      }
    }

    function iniciarOSAoSelecionarModelo() {
      const modelo = document.getElementById('modeloOS').value;
      if (!modelo) return;

      if (currentStep < 2) {
        showStep(2);
      }

      setTimeout(() => {
        const nomeCliente = document.getElementById('nomeCliente');
        if (nomeCliente) nomeCliente.focus();
      }, 50);
    }

    function formatarTelefone(event) {
      let input = event.target;
      let value = input.value.replace(/\D/g, '').substring(0, 11);
      if (value.length > 2) value = value.replace(/^(\d{2})(\d)/, '($1) $2');
      if (value.length > 10) value = value.replace(/(\d{5})(\d)/, '$1-$2');
      input.value = value;
    }

    function handleEnterKey(event) {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      if (validarPassoAtual(true)) {
        focusNextInput(event.target);
      }
    }

    function focusNextInput(currentInput) {
      const campos = getVisibleFields();
      const index = campos.indexOf(currentInput);
      if (index >= 0 && index < campos.length - 1) {
        campos[index + 1].focus();
      } else {
        nextStep();
      }
    }

    function getVisibleFields() {
      return Array.from(document.querySelectorAll('[data-form-field="true"]')).filter(campo => {
        return campo.offsetParent !== null && !campo.closest('.hidden') && !campo.disabled && !campo.readOnly;
      });
    }

    function validarPassoAtual(mostrarAlerta) {
      const stepElement = document.querySelector(`.form-step[data-step="${currentStep}"]`);
      if (!stepElement) return true;
      let valido = true;
      stepElement.querySelectorAll('input, select, textarea, button').forEach(campo => campo.classList.remove('invalid-field'));

      if (currentStep === 1) {
        const modeloEscolhido = document.getElementById('modeloOS').value;
        if (!modeloEscolhido) {
          document.querySelectorAll('.modelo-os-btn').forEach(btn => btn.classList.add('invalid-field'));
          if (mostrarAlerta) alert('Selecione o modelo da OS');
          const botao = document.getElementById('mainActionButton');
          if (botao) botao.disabled = true;
          return false;
        }
      }

      const campos = Array.from(stepElement.querySelectorAll('input:not([type="radio"]), select, textarea')).filter(campo => {
        return campo.offsetParent !== null && !campo.closest('.hidden') && !campo.disabled && !campo.readOnly;
      });

      campos.forEach(campo => {
        let ok = true;
        if (campo.id === 'nomeCliente') ok = campo.value.trim().length >= 3;
        else if (campo.id === 'telefone') ok = campo.value.replace(/\D/g, '').length === 11;
        else if (campo.id === 'modeloOS') ok = campo.value !== '';
        else if (campo.id === 'tecnico') ok = campo.value !== '';
        else if (campo.id === 'modeloEquipamento') ok = campo.value.trim().length >= 2;
        else if (campo.id === 'qualAcessorio') ok = !document.querySelector('input[name="acessorio"][value="sim"]:checked') || campo.value.trim().length >= 3;
        else if (campo.id === 'qualDefeito') ok = !document.querySelector('input[name="defeito"][value="sim"]:checked') || campo.value.trim().length >= 3;
        else if (campo.required) ok = campo.value.trim() !== '';
        if (!ok) {
          campo.classList.add('invalid-field');
          valido = false;
        }
      });

      stepElement.querySelectorAll('.radio-group').forEach(group => {
        if (group.offsetParent !== null && !group.closest('.hidden')) {
          const radio = group.querySelector('input[type="radio"]');
          if (!radio) return;
          const radios = Array.from(document.querySelectorAll(`input[name="${radio.name}"]`));
          const required = radios.some(r => r.required);
          const checked = radios.some(r => r.checked);
          if (required && !checked) {
            radios.forEach(r => r.classList.add('invalid-field'));
            valido = false;
          }
        }
      });

      const botao = document.getElementById('mainActionButton');
      if (botao) botao.disabled = !valido;
      if (!valido && mostrarAlerta) alert('Verifique os Campos em Vermelho');
      return valido;
    }

    function validarPassosAnteriores() {
      const etapaAtual = currentStep;
      for (let i = 1; i < etapaAtual; i++) {
        currentStep = i;
        if (!validarPassoAtual(false)) {
          currentStep = etapaAtual;
          showStep(i);
          return false;
        }
      }
      currentStep = etapaAtual;
      return true;
    }

    function showStep(step) {
      currentStep = step;
      document.querySelectorAll('.form-step').forEach(s => {
        const stepNum = parseInt(s.dataset.step, 10);
        s.classList.toggle('visible-step', stepNum <= currentStep);
      });
      const botao = document.getElementById('mainActionButton');
      botao.textContent = currentStep === totalSteps ? 'Salvar e Imprimir' : 'Próximo →';
      atualizarProgresso();
      validarPassoAtual(false);
      if (currentStep === 1) {
        const botaoModelo = document.querySelector('.modelo-os-btn');
        if (botaoModelo) botaoModelo.focus();
        return;
      }
      const campo = document.querySelector(`.form-step[data-step="${currentStep}"] [data-form-field="true"]:not([type="radio"])`);
      if (campo && campo.offsetParent !== null) campo.focus();
    }

    function nextStep() {
      if (!validarPassosAnteriores() || !validarPassoAtual(true)) return;
      if (currentStep < totalSteps) showStep(currentStep + 1);
    }

    function handleActionButtonClick() {
      if (!validarPassoAtual(true)) return;
      if (currentStep === totalSteps) salvarImprimir();
      else nextStep();
    }

    function collectOSData() {
      const modelo = document.getElementById('modeloOS').value;
      const config = MODELOS_OS[modelo] || {};
      const ligaSelecionado = document.querySelector('input[name="liga"]:checked');
      return {
        modeloOS: modelo,
        modeloOSTexto: config.texto || 'Ordem de Serviço',
        osNumber: document.getElementById('osNumber').textContent,
        dataEntrada: document.getElementById('dataEntrada').textContent,
        dataSaida: document.getElementById('dataSaida').textContent,
        nomeCliente: document.getElementById('nomeCliente').value,
        telefone: document.getElementById('telefone').value,
        tecnico: document.getElementById('tecnico').value,
        marcaEquipamento: config.mostrarMarcaModelo ? document.getElementById('marcaEquipamento').value : '',
        modeloEquipamento: config.mostrarMarcaModelo ? document.getElementById('modeloEquipamento').value : '',
        senhaEscrita: config.mostrarSenha ? document.getElementById('senhaEscrita').value : '',
        senhaPadrao: config.mostrarPadrao ? senhaPadrao.join(' - ') : '',
        acessorioSim: config.mostrarAcessorio && !!document.querySelector('input[name="acessorio"][value="sim"]:checked'),
        qualAcessorio: config.mostrarAcessorio ? document.getElementById('qualAcessorio').value : '',
        ligaSim: config.mostrarLiga && ligaSelecionado ? ligaSelecionado.value === 'sim' : null,
        defeitoFisicoSim: config.mostrarDefeitoFisico && !!document.querySelector('input[name="defeito"][value="sim"]:checked'),
        qualDefeito: config.mostrarDefeitoFisico ? document.getElementById('qualDefeito').value : '',
        descricaoDefeito: document.getElementById('descricaoDefeito').value,
        observacoes: document.getElementById('observacoes').value,
        timestamp: new Date().getTime()
      };
    }

    function saveOSData(osData) {
      let history = JSON.parse(localStorage.getItem('os_history') || '[]');
      const existingIndex = history.findIndex(item => item.osNumber === osData.osNumber);
      if (existingIndex > -1) history[existingIndex] = osData;
      else history.push(osData);
      localStorage.setItem('os_history', JSON.stringify(history));
    }

    function escaparHTML(valor) {
      return String(valor ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[m]));
    }

    function salvarImprimir() {
      if (!validarPassoAtual(true)) return;
      const osData = collectOSData();
      saveOSData(osData);
      const getCampo = (valor, padrao = '______') => valor && String(valor).trim() !== '' ? escaparHTML(valor) : padrao;
      const logoSrc = new URL('img/logo.png', window.location.href).href;
      const config = MODELOS_OS[osData.modeloOS] || {};

      const acessorioHTML = osData.acessorioSim && osData.qualAcessorio.trim() !== '' ? `<tr><td class="lbl">ACESSÓRIO:</td><td colspan="3" class="line">${getCampo(osData.qualAcessorio)}</td></tr>` : '';
      const defeitoHTML = osData.defeitoFisicoSim && osData.qualDefeito.trim() !== '' ? `<tr><td class="lbl">DEFEITO FÍSICO:</td><td colspan="3" class="line">${getCampo(osData.qualDefeito)}</td></tr>` : '';
      const ligaHTML = config.mostrarLiga ? `<td class="lbl right">LIGA:</td><td class="line">${osData.ligaSim ? 'Sim' : 'Não'}</td>` : `<td></td><td></td>`;
      const marcaModeloHTML = config.mostrarMarcaModelo ? `
          <tr><td class="lbl">MARCA:</td><td class="line">${getCampo(osData.marcaEquipamento, '')}</td><td class="lbl right">MODELO:</td><td class="line">${getCampo(osData.modeloEquipamento)}</td></tr>` : '';

      const desenharPadraoImpressao = () => {
        if (!config.mostrarPadrao) return '';
        const selecionados = String(osData.senhaPadrao || '').split(' - ').filter(Boolean);
        const pontos = Array.from({ length: 9 }, (_, i) => String(i + 1));
        const botoes = pontos.map(ponto => {
          const ordem = selecionados.indexOf(ponto) + 1;
          const ativo = ordem > 0;
          return `<div class="ponto ${ativo ? 'ativo' : ''}">${ativo ? ordem : '•'}</div>`;
        }).join('');
        return `<div class="padrao"><div class="grid-padrao">${botoes}</div><div><strong>Cliques:</strong><br>${getCampo(osData.senhaPadrao)}</div></div>`;

      const senhaHTML = config.mostrarSenha ? `
        <tr>
          <td class="lbl">SENHA:</td>

          </div>
        </div>`;

      const gerarBlocoDados = (tipoVia) => {
        const campoSaida = tipoVia === 'cliente'
          ? `<td class="lbl right">SAÍDA:</td>
             <td class="saida-data">
               <span></span><b>/</b><span></span><b>/</b><span class="ano"></span>
             </td>`
          : `<td></td><td></td>`;

        return `
        <h3>${getCampo(osData.modeloOSTexto)}</h3>

          <tr>
            <td class="lbl os">OS Nº:</td><td class="bold">${getCampo(osData.osNumber)}</td>
            <td class="lbl right">ENTRADA:</td><td>${getCampo(osData.dataEntrada)}</td>
            ${campoSaida}
          </tr>
        </table>
        <table class="dados">
          <tr><td class="lbl">CLIENTE:</td><td colspan="3" class="line">${getCampo(osData.nomeCliente)}</td></tr>
          <tr><td class="lbl">TELEFONE:</td><td class="line">${getCampo(osData.telefone)}</td><td class="lbl right">TÉCNICO:</td><td class="line">${getCampo(osData.tecnico)}</td></tr>
          ${marcaModeloHTML}
          ${config.mostrarLiga ? `<tr><td class="lbl">LIGA:</td><td class="line">${osData.ligaSim ? 'Sim' : 'Não'}</td><td></td><td></td></tr>` : ''}
          ${senhaHTML}

      };

      const topoVia = (nomeVia) => `
        <div class="topo-via">
          <div class="logo-box"><img src="${logoSrc}" alt="Logo"></div>
          <div class="via-tag">${nomeVia}</div>
          <div class="contato-print">Contato: 84 99809-6865</div>
        </div>`;

      const viaCliente = `
        <div class="conteudo-print cliente">
          ${topoVia('VIA DO CLIENTE')}
          ${gerarBlocoDados('cliente')}
          ${avisoHTML}
          <div class="guarde-via">GUARDE ESTA VIA PARA A RETIRADA DO EQUIPAMENTO E PARA O ATENDIMENTO DA GARANTIA.</div>
          ${termosHTML}
        </div>`;

      const viaLoja = `
        <div class="conteudo-print loja">

              ( ) RG &nbsp;&nbsp; ( ) CNH &nbsp;&nbsp; ( ) CPF Digital &nbsp;&nbsp; ( ) Não apresentou
            </div>

            <div class="retirada-linha dupla opcoes">
              <div><b>Via do cliente:</b> ( ) Sim &nbsp; ( ) Não</div>
              <div><b>Autorização do titular:</b> ( ) Sim &nbsp; ( ) Não se aplica</div>

          if (!conteudo) return;

          conteudo.style.zoom = '1';
          via.classList.remove('ajuste-compacto');

          if (conteudo.scrollHeight > via.clientHeight - 4) {
            via.classList.add('ajuste-compacto');
          }

          conteudo.style.zoom = '1';
          const alturaDisponivel = via.clientHeight - 4;
          const alturaConteudo = conteudo.scrollHeight;

          if (alturaConteudo > alturaDisponivel) {
            const escala = Math.max(0.88, Math.min(1, alturaDisponivel / alturaConteudo));
            conteudo.style.zoom = escala.toFixed(3);
          }
        });
